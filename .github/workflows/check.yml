name: Check

# プルリクエストと main 以外への push で tools/check.sh を動かす。
# 公開（deploy.yml）とは別。ここが赤くなったら、main に入れる前に直す。
on:
  pull_request:
  push:
    branches-ignore: ["main"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: ルールの機械チェック
        run: bash tools/check.sh
