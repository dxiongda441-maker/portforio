<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ページが見つかりません | オルタ</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#211812" />
    <link rel="icon" href="/portforio/assets/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/portforio/assets/apple-touch-icon.png" />
    <style>
      :root {
        --ink: #211812;
        --paper: #fffaf1;
        --gold: #d8aa4d;
      }

      * {
        box-sizing: border-box;
      }

      body {
        align-items: center;
        background:
          linear-gradient(135deg, rgba(223, 167, 169, 0.18), transparent 45%),
          linear-gradient(315deg, rgba(198, 107, 50, 0.12), transparent 45%),
          var(--paper);
        color: var(--ink);
        display: flex;
        font-family: Arial, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
        margin: 0;
        min-height: 100svh;
        padding: clamp(32px, 8vw, 96px);
      }

      main {
        max-width: 620px;
      }

      .label {
        color: var(--gold);
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.08em;
        margin: 0 0 18px;
        text-transform: uppercase;
      }

      h1 {
        font-size: clamp(38px, 7vw, 78px);
        line-height: 1.06;
        margin: 0 0 20px;
      }

      p {
        font-size: clamp(15px, 1.8vw, 18px);
        line-height: 1.9;
        margin: 0 0 32px;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
      }

      a {
        align-items: center;
        border: 1px solid rgba(33, 24, 18, 0.5);
        color: inherit;
        display: inline-flex;
        font-size: 14px;
        font-weight: 800;
        justify-content: center;
        min-height: 48px;
        padding: 0 22px;
        text-decoration: none;
      }

      a.primary {
        background: var(--ink);
        border-color: var(--ink);
        color: var(--paper);
      }

      a:hover {
        border-color: var(--gold);
        color: var(--gold);
      }

      a.primary:hover {
        background: #38271a;
        color: var(--paper);
      }

      a:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="label">404 / Not Found</p>
      <h1>そのページは見つかりませんでした。</h1>
      <p>
        URLが変わったか、削除された可能性があります。トップページの作品一覧から、公開中のアプリとケーススタディをご覧いただけます。
      </p>
      <div class="actions">
        <a class="primary" href="/portforio/">トップページへ</a>
        <a href="/portforio/#works">作品一覧を見る</a>
      </div>
    </main>
  </body>
</html>
